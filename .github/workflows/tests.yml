name: Tests

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', laravel: '12.*', statamic: '5.*', testbench: '10.*', stability: prefer-lowest}
          - {php: '8.4', laravel: '12.*', statamic: '5.*', testbench: '10.*', stability: prefer-stable}
          - {php: '8.3', laravel: '12.*', statamic: '6.*', testbench: '10.*', stability: prefer-lowest}
          - {php: '8.5', laravel: '13.*', statamic: '6.*', testbench: '11.*', stability: prefer-stable}

    name: PHP ${{ matrix.php }} / L${{ matrix.laravel }} / S${{ matrix.statamic }} / ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "statamic/cms:${{ matrix.statamic }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

      - name: Check style and analyse current dependencies
        if: matrix.laravel == '13.*'
        run: |
          vendor/bin/pint --test
          composer analyse
          composer audit

  required:
    name: Package checks
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test.result }}
